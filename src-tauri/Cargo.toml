[package]
name = "windows-crasher"
version = "1.4.0"
description = "Windows Crasher Desktop Game with Watchdog in Rust"
authors = ["Antigravity Senior Developer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
