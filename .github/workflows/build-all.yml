name: Build All Platforms (Android APK, Windows EXE & Web)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Crasher-Android-v2.6.0-APK
          path: android/app/build/outputs/apk/debug/*.apk

  build-windows-and-web:
    name: Build Windows EXE & Web
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package HTML5 Web bundle for Itch.io
        run: npm run pack:web

      - name: Build Windows Installer and Portable EXE
        run: npm run dist

      - name: Upload Windows and Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Crasher-v2.6.0-Windows-and-Web
          path: |
            dist/*.exe
            dist/*.zip
