name: Build All Platforms (Android APK, Windows EXE & Web)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Windows-Crasher-v2.6.0-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Crasher-Android-v2.6.0-APK
          path: android/app/build/outputs/apk/debug/Windows-Crasher-v2.6.0-Android.apk
          if-no-files-found: error

  build-windows-and-web:
    name: Build Windows EXE & Web
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package HTML5 Web bundle for Itch.io
        run: npm run pack:web

      - name: Build Windows Installer and Portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows and Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Crasher-v2.6.0-Windows-and-Web
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  create-release:
    name: Publish Release Assets
    needs: [build-android, build-windows-and-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-Crasher-Android-v2.6.0-APK
          path: release-assets/

      - name: Download Windows and Web Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Crasher-v2.6.0-Windows-and-Web
          path: release-assets/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.6.0"
          name: "Windows Crasher v2.6.0"
          draft: false
          prerelease: false
          body: |
            # ⚠️ Windows Crasher v2.6.0
            
            Videojuego incremental y de benchmarking de hardware al filo de la pantalla azul.
            
            ### 👨‍💻 Creador & Apoyo
            Desarrollado por **Daniel Valimaña**:
            👉 [ko-fi.com/danielfbr](https://ko-fi.com/danielfbr)
            
            ### 📦 Descargas Disponibles
            - 📱 **Android APK**: `Windows-Crasher-v2.6.0-Android.apk` (Instalable en cualquier móvil Android)
            - ⚡ **Windows Portable**: `Windows Crasher-v2.6.0-Portable.exe` (Jugar directo sin instalación)
            - 💻 **Windows Setup**: `Windows Crasher Setup 2.6.0.exe` (Instalador tradicional para PC)
            - 🌐 **Web HTML5**: `Windows-Crasher-v2.6.0-HTML5-Web.zip` (Para subir a Itch.io y jugar en navegador)
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
